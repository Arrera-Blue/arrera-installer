<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem : Stylized Arrera 'A' -->
  <g transform="translate(20, 10)">
    <!-- Back wing -->
    <path d="M 60 10 L 105 105 L 80 105 L 60 48 L 40 105 L 15 105 Z" fill="url(#gradAccent)" opacity="0.85" />
    
    <!-- Dynamic forward cross/chevron -->
    <path d="M 60 8 L 95 85 L 75 85 L 60 42 L 45 85 L 25 85 Z" fill="url(#gradPrimary)" filter="url(#glow)" />
    
    <!-- Central cyan energy bar -->
    <path d="M 36 68 L 84 68 L 78 78 L 42 78 Z" fill="#38bdf8" />
    
    <!-- Bottom stabilizing base -->
    <circle cx="60" cy="112" r="4" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(150, 75)">
    <!-- ARRERA -->
    <text x="0" y="0" font-family="'Inter', 'Cantarell', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff">ARRERA</text>
    <!-- LINUX -->
    <text x="210" y="0" font-family="'Inter', 'Cantarell', 'Segoe UI', sans-serif" font-size="44" font-weight="300" letter-spacing="3" fill="#38bdf8">LINUX</text>
    <!-- Tagline -->
    <text x="4" y="28" font-family="'Inter', 'Cantarell', 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="6" fill="#94a3b8">DISTRIBUTION FEDORA MODERNE</text>
  </g>
</svg>
