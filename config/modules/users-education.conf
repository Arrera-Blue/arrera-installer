# Configuration du module users pour Arrera Blue Édition Éducation
# Compte prédéfini "parents" et nom de machine "arrera-school"
---
defaultGroups:
    - wheel
    - users
    - audio
    - video
    - dialout
    - storage
    - optical
    - network
    - input

autologinGroup: wheel
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
doAutologin: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user_shell: /bin/bash
avatarInstall: true

# Presets officiels Calamares (permet de préremplir et valider les champs cachés)
presets:
    fullName:
        value: "Parents"
        editable: false
    loginName:
        value: "parents"
        editable: false

# Rétrocompatibilité racine
fullName: "Parents"
loginName: "parents"

# Nom de machine fixe
hostname:
    location: etcfile
    writeHostsFile: true
    template: "arrera-school"
