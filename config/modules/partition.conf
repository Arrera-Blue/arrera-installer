# Configuration du module partition pour Arrera Linux
# Optimisé pour Fedora (x86_64 et aarch64) — installation UEFI standard
---
# Système de fichiers par défaut pour l'installation
defaultFileSystemType:  "ext4"

# Types de systèmes de fichiers disponibles au choix lors du partitionnement
availableFileSystemTypes:  ["ext4", "btrfs", "xfs"]

# Support du layout hybride BIOS+EFI : DÉSACTIVÉ.
# Cette option ajoute systématiquement une partition "BIOS Boot" (8 Mo,
# drapeau bios_grub) en début de disque, même sur les systèmes purement
# UEFI. Sur aarch64 (exclusivement UEFI, sans mode BIOS legacy), cette
# partition est totalement inutile et laisse un espace vide/une partition
# orpheline en début de disque qui perturbe le partitionnement automatique.
# Calamares crée déjà la partition EFI System (ESP) nécessaire de façon
# standard sur les systèmes démarrés en UEFI (x86_64 et aarch64), donc
# cette option n'est pas requise.
createHybridBootloaderLayout: false

# Table de partitionnement par défaut (GPT moderne)
defaultPartitionTableType: "gpt"

# Points de montage système essentiels à ne pas démonter
essentialMounts: [ "live-*", "control", "ventoy" ]

# Désactiver LVM par défaut pour simplifier le partitionnement automatique
lvm:
    enable: false
