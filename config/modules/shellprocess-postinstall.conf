# Configuration du module shellprocess-postinstall pour Arrera Linux
# Exécute la finalisation du système installé en chroot :
# 1. Vérification de la connectivité réseau
# 2. Rafraîchissement / mise à jour des paquets Arrera via DNF si en ligne
# 3. Application des réglages par défaut Arrera
# 4. Nettoyage des artefacts de session Live
---
dontChroot: false
timeout: 600

# Variables d'environnement Calamares
# ${gs[packagechooser_installmode]} contient "online" ou "offline" selon le choix de l'utilisateur
environment:
    - "INSTALL_MODE=${gs[packagechooser_installmode]}"

script:
    - name: "Arrera Linux Post-Install Finalization"
      command: |
        #!/bin/bash
        set -e
        echo "=========================================================="
        echo "   Arrera Linux - Finalisation post-installation"
        echo "=========================================================="

        echo "Mode d'installation sélectionné : ${INSTALL_MODE:-online}"

        # 1. Vérification du mode d'installation et de la connectivité réseau
        IS_ONLINE=0
        if [ "$INSTALL_MODE" = "offline" ]; then
            echo "[1/4] Mode hors-ligne choisi par l'utilisateur. Aucune connexion réseau requise."
        else
            echo "[1/4] Mode en ligne sélectionné. Test de la connectivité Internet..."
            if ping -c 1 -W 3 1.1.1.1 >/dev/null 2>&1 || ping -c 1 -W 3 8.8.8.8 >/dev/null 2>&1; then
                IS_ONLINE=1
                echo "-> Connexion Internet active et confirmée."
            else
                echo "-> ATTENTION : Mode en ligne demandé mais aucune connexion Internet détectée."
                echo "-> Poursuite de l'installation en mode hors-ligne."
            fi
        fi

        # 2. Mise à jour DNF si en mode en ligne et connecté
        if [ "$IS_ONLINE" -eq 1 ]; then
            echo "[2/4] Mise à jour des métadonnées et paquets Arrera via DNF..."
            dnf clean all || true
            dnf makecache -y || true
            # Mise à jour sélective des composants Arrera et des correctifs critiques
            dnf upgrade -y --refresh arrera-\* || true
        else
            echo "[2/4] Étape réseau ignorée (installation hors-ligne)."
        fi

        # 3. Application des réglages d'environnement Arrera
        echo "[3/4] Application des réglages par défaut Arrera..."
        if [ -d "/etc/dconf/db/local.d" ]; then
            dconf update || true
        fi

        # Régénération du cache des icônes et thèmes si présents
        if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f /usr/share/icons/hicolor || true
        fi

        # 4. Nettoyage des résidus Live / Kiosque sur la machine installée
        echo "[4/4] Nettoyage des unités et fichiers d'installation..."
        rm -f /etc/systemd/system/arrera-kiosk.service
        rm -f /etc/systemd/system/multi-user.target.wants/arrera-kiosk.service
        rm -rf /root/install.log /var/log/calamares*

        echo "=========================================================="
        echo "   Post-installation Arrera terminée avec succès !"
        echo "=========================================================="
        exit 0
