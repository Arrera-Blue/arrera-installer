# Configuration du choix du mode d'installation pour Arrera Blue 2026
# Permet à l'utilisateur de choisir entre une installation En ligne ou Hors-ligne
---
mode: required
method: legacy

labels:
    step: "Mode d'installation"

items:
    - id: online
      name: "Installation en ligne (Recommandée)"
      description: |
        <p style="font-size: 14px; margin-bottom: 12px;"><b>Système 100% à jour dès le premier démarrage.</b></p>
        <p>Cette méthode connecte l'installateur aux dépôts officiels Fedora et COPR pour préparer un environnement optimal :</p>
        <ul>
          <li><b>Derniers paquets :</b> Télécharge les versions les plus récentes de l'environnement Arrera Blue.</li>
          <li><b>Sécurité immédiate :</b> Applique tous les correctifs de sécurité publiés depuis la création du média.</li>
          <li><b>Dépôts configurés :</b> Prépare le gestionnaire de paquets DNF pour vos futures applications.</li>
        </ul>
        <p style="margin-top: 16px; color: #5e5c64; font-size: 12px;"><i>💡 Nécessite une connexion Internet active (Wi-Fi ou câble Ethernet).</i></p>

    - id: offline
      name: "Installation hors-ligne (Standard)"
      description: |
        <p style="font-size: 14px; margin-bottom: 12px;"><b>Installation locale rapide et autonome.</b></p>
        <p>Cette méthode installe Arrera Blue directement depuis les fichiers embarqués sur le support d'installation :</p>
        <ul>
          <li><b>Ultra-rapide :</b> Aucun téléchargement réseau, l'installation se termine en quelques minutes.</li>
          <li><b>Autonomie totale :</b> Fonctionne partout, même sans accès à Internet ou réseau Wi-Fi.</li>
          <li><b>Mises à jour différées :</b> Vous pourrez mettre à jour votre système ultérieurement à tout moment.</li>
        </ul>
        <p style="margin-top: 16px; color: #5e5c64; font-size: 12px;"><i>⚡ Idéal si votre connexion est instable ou pour une installation express.</i></p>

default: online
