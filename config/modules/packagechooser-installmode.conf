# Configuration du choix du mode d'installation pour Arrera Blue 2026
# Permet à l'utilisateur de choisir entre une installation En ligne ou Hors-ligne
---
mode: required
method: legacy

labels:
    step: "Mode d'installation"

items:
    - id: online
      name: "Installation en ligne (Recommandée)"
      description: "Télécharge et installe les dernières mises à jour de sécurité et les versions les plus récentes des paquets Arrera depuis les dépôts officiels pendant l'installation."
      screenshot: "/usr/share/calamares/branding/arrera/online-mode.png"

    - id: offline
      name: "Installation hors-ligne (Standard)"
      description: "Installe directement Arrera Blue depuis le média d'installation sans télécharger de paquets. Idéal si vous n'avez pas de connexion Internet ou souhaitez une installation ultra-rapide."
      screenshot: "/usr/share/calamares/branding/arrera/offline-mode.png"

default: online
