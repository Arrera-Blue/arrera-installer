# Configuration du module services-systemd pour Arrera Linux
# Activation des services essentiels et désactivation des composants Live/Kiosque
---
services:
  - name: "NetworkManager"
    action: "enable"
    mandatory: true

  - name: "firewalld"
    action: "enable"
    mandatory: false

  - name: "gdm"
    action: "enable"
    mandatory: true

  - name: "systemd-resolved"
    action: "enable"
    mandatory: false

  - name: "chronyd"
    action: "enable"
    mandatory: false

  - name: "arrera-kiosk"
    action: "disable"
    mandatory: false

  - name: "calamares-kiosk"
    action: "disable"
    mandatory: false

  - name: "livesys"
    action: "disable"
    mandatory: false

  - name: "livesys-late"
    action: "disable"
    mandatory: false
