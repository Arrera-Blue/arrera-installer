# Configuration du module bootloader pour Arrera Linux
# Support GRUB2 pour architectures EFI (avec Secure Boot via Shim) et BIOS sous Fedora
---
# Chargeur EFI : sb-shim est le standard officiel Fedora (shim + grubx64.efi)
efiBootLoader: "sb-shim"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 0"
  - "console-mode keep"

kernelParams: [ "rhgb", "quiet", "splash", "loglevel=3", "rd.udev.log_priority=3", "systemd.show_status=false", "vt.global_cursor_default=0" ]

# Commandes GRUB2 Fedora
grubInstall: "grub2-install"
grubMkconfig: "grub2-mkconfig"
grubCfg: "/boot/grub2/grub.cfg"
grubProbe: "grub2-probe"
efiBootMgr: "efibootmgr"

# Identifiant EFI sous /boot/efi/EFI/
efiBootloaderId: "fedora"

# Installation du binaire de secours EFI (bootx64.efi / bootaa64.efi)
installEFIFallback: true
