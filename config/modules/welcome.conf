# Configuration du module d'accueil (welcome) pour Arrera Linux
# Vérifications des prérequis système (Internet facultatif)
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 10.0
    requiredRam: 1.5
    internetCheckUrl: "https://fedoraproject.org"
    check:
        - storage
        - ram
        - power
        - internet
    required:
        - storage
        - ram
